openapi: 3.0.3
info:
  title: LOTE RIA — API REST Comercio Electrónico
  version: 1.0.0
  description: >
    API REST para el Proyecto Integrador de Comercio Electrónico (LOTE RIA).
    Lote de vehículos seminuevos/usados certificados con diferenciación explícita de unidades nuevas (0 km).
servers:
  - url: http://localhost:3001
    description: Servidor local de desarrollo
paths:
  /api/health:
    get:
      summary: Estado del servicio API
      responses:
        '200': { description: Servicio operativo }
  /api/products:
    get:
      summary: Consultar catálogo de vehículos activos
      responses:
        '200': { description: Lista de vehículos }
  /api/returns:
    post:
      summary: Solicitar devolución, cambio o garantía (genera folio DEV-/GAR-)
      responses:
        '201': { description: Solicitud registrada }
    get:
      summary: Consultar solicitudes propias
      responses:
        '200': { description: Listado de devoluciones }
  /api/returns/{id}:
    patch:
      summary: Resolver solicitud de devolución/garantía (Admin · devoluciones.gestionar)
      responses:
        '200': { description: Solicitud resuelta }
        '403': { description: Sin permiso }
  /api/support:
    post:
      summary: Crear ticket de atención al cliente (genera folio ATN-)
      responses:
        '201': { description: Ticket registrado }
  /api/admin/reports/ventas:
    get:
      summary: Reporte de ventas (Admin · reportes.ver)
      responses:
        '200': { description: Métricas financieras }
        '403': { description: Sin permiso }
