openapi: 3.0.3
info:
  title: LOTE RIA — API REST Comercio Electrónico
  version: 1.0.0
  description: API REST para LOTE RIA (54 vehículos seminuevos certificados y nuevos 0 km).
servers:
  - url: http://localhost:3001
paths:
  /api/auth/login:
    post:
      summary: Iniciar sesión con correo y contraseña
      responses:
        '200': { description: Sesión iniciada }
  /api/auth/register:
    post:
      summary: Crear nueva cuenta de cliente
      responses:
        '201': { description: Usuario creado }
  /api/products:
    get:
      summary: Listar los 54 vehículos activos del catálogo
      responses:
        '200': { description: Lista paginada }
  /api/orders:
    post:
      summary: Crear pedido transaccional
      responses:
        '201': { description: Pedido creado }
  /api/returns:
    post:
      summary: Crear solicitud de devolución o garantía
      responses:
        '201': { description: Solicitud creada }
  /api/support:
    post:
      summary: Crear ticket de atención al cliente
      responses:
        '201': { description: Ticket registrado }
